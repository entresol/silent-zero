# SPDX-License-Identifier: BSD-2-Clause
# Rebuilds the page, the wiki's pages and the PDF of a new paper version, for every pull request that
# touches the paper, the wiki or the changelog, and commits the result into the pull request. A two-click fix
# in GitHub's web editor then arrives complete. A published PDF is never replaced (build_site.py),
# and a PDF that differs only in bytes, not in words, is left as it was.
#
# The generated files (index.html, the wiki's HTML, the PDFs) are what makes two open pull requests conflict:
# each carries its own rebuilt copy. So the build first merges main into the branch, takes main's copy of a
# generated file where they differ, and rebuilds; a conflict in any other file stops the run with a message.
# Whenever main changes, every open pull request from this repository is built again the same way, by a manual
# run of this workflow on its branch, so none of them is left behind.
name: Build page

on:
  pull_request:
    paths: ["paper/**", "wiki/**", "CHANGELOG.md", ".github/workflows/build-page.yml"]
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["paper/**", "wiki/**", "CHANGELOG.md"]

permissions:
  contents: write
  actions: write
  pull-requests: read

concurrency:
  group: build-page-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

env:
  BRANCH: ${{ github.head_ref || github.ref_name }}

jobs:
  update-open-pull-requests:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Build every open pull request again on top of the new main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr list --repo "$GITHUB_REPOSITORY" --state open --json headRefName,isCrossRepository \
            --jq '.[] | select(.isCrossRepository == false) | .headRefName' |
          while IFS= read -r b; do
            [ -n "$b" ] || continue
            echo "building $b"
            gh workflow run build-page.yml --repo "$GITHUB_REPOSITORY" --ref "$b" || echo "::warning::could not start a build of $b"
          done

  build:
    if: github.event_name != 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 10   # a slow package mirror once held a run for over nine minutes
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ env.BRANCH }}
          fetch-depth: 0

      - name: Know what is published
        run: git fetch --no-tags "https://github.com/${GITHUB_REPOSITORY}" "+refs/heads/main:refs/remotes/origin/main"

      # The wiki is written from sources in a private repository; only its own pages may come over, never a
      # source text. A file under wiki/ that is not a page (or its generated Markdown twin, name.html.md), the
      # index, the log, the rings or the schema fails
      # the pull request, as does a page without front matter or far longer than any page. Every commit counts,
      # not only the result: a merge commit would carry a file that a later commit removed.
      - name: Only wiki pages in wiki/
        run: |
          bad=0
          while IFS= read -r f; do
            [ -n "$f" ] || continue
            if ! printf '%s\n' "$f" | grep -qE '^wiki/((CLAUDE|index|log|rings)\.md|index\.html(\.md)?|(sources|concepts|systems|design)/[a-z0-9-]+\.(md|html|html\.md))$'; then
              echo "::error file=$f::Not a wiki page. Only pages, the index, the log, the rings and the schema belong in wiki/."; bad=1; continue
            fi
            [ -f "$f" ] || continue   # added by one commit, removed by a later one: the path check above is enough
            case "$f" in wiki/*/*.html.md) continue;; esac   # a page's generated Markdown twin: no front matter, and longer than the page
            case "$f" in wiki/*/*.md)
              if ! head -n 1 "$f" | grep -qx -- '---' || ! sed -n '2,12p' "$f" | grep -q '^type: '; then
                echo "::error file=$f::A wiki page starts with its front matter (type, status, sources, updated)."; bad=1
              fi
              if [ "$(wc -c < "$f")" -gt 20000 ]; then
                echo "::error file=$f::Over 20 KB, twice the longest page so far. Is this a source text?"; bad=1
              fi;;
            esac
          done <<EOF
          $(git log --format= --name-only --diff-filter=ACMR origin/main..HEAD -- wiki/ | sort -u)
          EOF
          exit $bad

      - name: Bring the branch up to date with main
        if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git merge-base --is-ancestor origin/main HEAD; then echo "already up to date with main"; exit 0; fi
          if ! git merge --no-edit origin/main; then
            others=""
            for f in $(git diff --name-only --diff-filter=U); do
              case "$f" in
                index.html|llms.txt|sitemap.xml|silent-zero.pdf|zos-zero-os.pdf|versions/*|lexicon/*|wiki/*.html|wiki/*/*.html|wiki/*.html.md|wiki/*/*.html.md)
                  git checkout --theirs -- "$f" 2>/dev/null || git rm -q -- "$f"
                  git add -- "$f";;
                *)
                  echo "::error file=$f::This branch conflicts with main in a file that is not generated. Merge main into the branch and resolve it by hand."
                  others=1;;
              esac
            done
            if [ -n "$others" ]; then git merge --abort; exit 1; fi
            git commit -q --no-edit
          fi

      - name: Install pandoc 3.6.4, LaTeX and Poppler
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            texlive-latex-base texlive-latex-recommended texlive-latex-extra \
            texlive-fonts-recommended poppler-utils
          curl -fsSL -o /tmp/pandoc.deb https://github.com/jgm/pandoc/releases/download/3.6.4/pandoc-3.6.4-1-amd64.deb
          sudo dpkg -i /tmp/pandoc.deb

      - name: Build
        run: sh paper/build.sh

      - name: Keep PDFs whose words did not change
        run: |
          words() { pdftotext "$1" - | python3 -c 'import re, sys; print(" ".join(re.sub(r"-\n", "", sys.stdin.read()).split()))'; }
          for f in $(git diff --name-only -- versions silent-zero.pdf zos-zero-os.pdf); do
            git show "HEAD:$f" > /tmp/old.pdf
            if [ "$(words /tmp/old.pdf)" = "$(words "$f")" ]; then git checkout -- "$f"; fi
          done

      - name: Commit the result
        env:
          SAME_REPO: ${{ github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository }}
        run: |
          git add -A index.html wiki lexicon use devel versions silent-zero.pdf zos-zero-os.pdf sitemap.xml llms.txt
          if ! git diff --cached --quiet; then
            git diff --cached --stat
            if [ "$SAME_REPO" != "true" ]; then
              echo "::error::The page is out of date. Run paper/build.sh and commit index.html (pull requests from forks cannot be updated automatically)."
              exit 1
            fi
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -q -m "Site: rebuild (automatic)"
          else
            echo "page is up to date"
          fi
          # push what the run added: the merge of main and the rebuild
          if [ "$SAME_REPO" = "true" ] && [ "$(git rev-parse HEAD)" != "$(git rev-parse "origin/${BRANCH}")" ]; then
            git push -q origin "HEAD:${BRANCH}"
          fi
