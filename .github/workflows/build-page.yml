# SPDX-License-Identifier: BSD-2-Clause
# Rebuilds the page, the wiki's pages and the PDF of a new paper version, for every pull request that
# touches the paper, the wiki or the changelog, and commits the result into the pull request. A two-click fix
# in GitHub's web editor then arrives complete. A published PDF is never replaced (build_site.py),
# and a PDF that differs only in bytes, not in words, is left as it was.
name: Build page

on:
  pull_request:
    paths: ["paper/**", "wiki/**", "CHANGELOG.md", ".github/workflows/build-page.yml"]

permissions:
  contents: write

concurrency:
  group: build-page-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10   # a slow package mirror once held a run for over nine minutes
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Know what is published
        run: git fetch --no-tags "https://github.com/${GITHUB_REPOSITORY}" "+refs/heads/main:refs/remotes/origin/main"

      # The wiki is written from sources in a private repository; only its own pages may come over, never a
      # source text. A file under wiki/ that is not a page, the index, the log, the rings or the schema fails
      # the pull request, as does a page without front matter or far longer than any page. Every commit counts,
      # not only the result: a merge commit would carry a file that a later commit removed.
      - name: Only wiki pages in wiki/
        run: |
          bad=0
          while IFS= read -r f; do
            [ -n "$f" ] || continue
            if ! printf '%s\n' "$f" | grep -qE '^wiki/((CLAUDE|index|log|rings)\.md|index\.html|(sources|concepts|systems|design)/[a-z0-9-]+\.(md|html))$'; then
              echo "::error file=$f::Not a wiki page. Only pages, the index, the log, the rings and the schema belong in wiki/."; bad=1; continue
            fi
            [ -f "$f" ] || continue   # added by one commit, removed by a later one: the path check above is enough
            case "$f" in wiki/*/*.md)
              if ! head -n 1 "$f" | grep -qx -- '---' || ! sed -n '2,12p' "$f" | grep -q '^type: '; then
                echo "::error file=$f::A wiki page starts with its front matter (type, status, sources, updated)."; bad=1
              fi
              if [ "$(wc -c < "$f")" -gt 20000 ]; then
                echo "::error file=$f::Over 20 KB, twice the longest page so far. Is this a source text?"; bad=1
              fi;;
            esac
          done <<EOF
          $(git log --format= --name-only --diff-filter=ACMR origin/main..HEAD -- wiki/ | sort -u)
          EOF
          exit $bad

      - name: Install pandoc 3.6.4, LaTeX and Poppler
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            texlive-latex-base texlive-latex-recommended texlive-latex-extra \
            texlive-fonts-recommended poppler-utils
          curl -fsSL -o /tmp/pandoc.deb https://github.com/jgm/pandoc/releases/download/3.6.4/pandoc-3.6.4-1-amd64.deb
          sudo dpkg -i /tmp/pandoc.deb

      - name: Build
        run: sh paper/build.sh

      - name: Keep PDFs whose words did not change
        run: |
          words() { pdftotext "$1" - | python3 -c 'import re, sys; print(" ".join(re.sub(r"-\n", "", sys.stdin.read()).split()))'; }
          for f in $(git diff --name-only -- versions silent-zero.pdf zos-zero-os.pdf); do
            git show "HEAD:$f" > /tmp/old.pdf
            if [ "$(words /tmp/old.pdf)" = "$(words "$f")" ]; then git checkout -- "$f"; fi
          done

      - name: Commit the result
        env:
          SAME_REPO: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
        run: |
          git add -A index.html wiki versions silent-zero.pdf zos-zero-os.pdf
          if git diff --cached --quiet; then echo "page is up to date"; exit 0; fi
          git diff --cached --stat
          if [ "$SAME_REPO" != "true" ]; then
            echo "::error::The page is out of date. Run paper/build.sh and commit index.html (pull requests from forks cannot be updated automatically)."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -q -m "Site: rebuild (automatic)"
          git push -q origin "HEAD:${GITHUB_HEAD_REF}"
