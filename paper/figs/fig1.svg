<svg viewBox="0 0 760 640" xmlns="http://www.w3.org/2000/svg" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="zOS stack: agents and tool access outside the trusted base; broker, safety controller, static system, kernel, bootloader and firmware inside it; authority runs through the broker, motion through the safety controller."><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1a1d1f"></path></marker></defs><text x="24" y="30" font-size="15" fill="#1a1d1f" font-weight="600" data-claude-text-id="title">The zOS stack: what a guarantee depends on, and what we know about it</text><text x="24" y="50" font-size="11.5" fill="#5c6569" data-claude-text-id="subtitle">Highlighted frame: trusted base, a guarantee depends on it. Dashed: outside the base. Tag: proven, tested or assumed.</text><rect x="24" y="78" width="150" height="176" rx="6" fill="none" stroke="#9aa3a8" stroke-width="1.25" stroke-dasharray="5 4"></rect><text x="99" y="158" font-size="14" fill="#1a1d1f" font-weight="600" text-anchor="middle" data-claude-text-id="agents">Agents</text><text x="99" y="178" font-size="11.5" fill="#5c6569" text-anchor="middle" data-claude-text-id="agents-tag">untrusted</text><text x="99" y="196" font-size="11.5" fill="#5c6569" text-anchor="middle" data-claude-text-id="agents-sub">own budget, own domain</text><rect x="250" y="78" width="236" height="72" rx="6" fill="#fdf3e1" stroke="#e8a020" stroke-width="2"></rect><text x="266" y="104" font-size="14" fill="#1a1d1f" font-weight="600" data-claude-text-id="broker">Capability broker</text><text x="266" y="124" font-size="11.5" fill="#5c6569" data-claude-text-id="broker-sub">isolated, yet in the trusted base</text><text x="266" y="141" font-size="11.5" fill="#1a1d1f" font-weight="600" data-claude-text-id="broker-tag">tested → target: proven</text><rect x="530" y="78" width="206" height="72" rx="6" fill="none" stroke="#9aa3a8" stroke-width="1.25" stroke-dasharray="5 4"></rect><text x="546" y="104" font-size="14" fill="#1a1d1f" font-weight="600" data-claude-text-id="tools">Tools · model access</text><text x="546" y="124" font-size="11.5" fill="#5c6569" data-claude-text-id="tools-sub">outside the base</text><text x="546" y="141" font-size="11.5" fill="#5c6569" data-claude-text-id="tools-tag">reached only via the broker</text><rect x="250" y="182" width="236" height="72" rx="6" fill="#fdf3e1" stroke="#e8a020" stroke-width="2"></rect><text x="266" y="208" font-size="14" fill="#1a1d1f" font-weight="600" data-claude-text-id="safety">Safety controller · loops</text><text x="266" y="228" font-size="11.5" fill="#5c6569" data-claude-text-id="safety-sub">highest criticality, MCS budget</text><text x="266" y="245" font-size="11.5" fill="#1a1d1f" font-weight="600" data-claude-text-id="safety-tag">tested → target: proven</text><rect x="530" y="182" width="206" height="72" rx="6" fill="none" stroke="#1a1d1f" stroke-width="1.25"></rect><text x="546" y="208" font-size="14" fill="#1a1d1f" font-weight="600" data-claude-text-id="actuator">Actuator</text><text x="546" y="228" font-size="11.5" fill="#5c6569" data-claude-text-id="actuator-sub">moved only by the loop</text><text x="546" y="245" font-size="11.5" fill="#5c6569" data-claude-text-id="actuator-tag">through its own driver</text><path d="M174 114L248 114" stroke="#1a1d1f" stroke-width="1.4" fill="none" marker-end="url(#ah)"></path><text x="211" y="106" font-size="11.5" fill="#5c6569" text-anchor="middle" data-claude-text-id="path-a">authority</text><path d="M486 114L528 114" stroke="#1a1d1f" stroke-width="1.4" fill="none" marker-end="url(#ah)"></path><path d="M174 218L248 218" stroke="#1a1d1f" stroke-width="1.4" fill="none" marker-end="url(#ah)"></path><text x="211" y="210" font-size="11.5" fill="#5c6569" text-anchor="middle" data-claude-text-id="path-m">motion</text><path d="M486 218L528 218" stroke="#1a1d1f" stroke-width="1.4" fill="none" marker-end="url(#ah)"></path><rect x="24" y="282" width="712" height="48" rx="6" fill="none" stroke="#9aa3a8" stroke-width="1.25" stroke-dasharray="5 4"></rect><text x="40" y="303" font-size="13.5" fill="#1a1d1f" font-weight="600" data-claude-text-id="l0-name">User-mode drivers · Linux driver island</text><text x="40" y="320" font-size="11.5" fill="#5c6569" data-claude-text-id="l0-sub">isolated, outside the base; assumed where a device writes memory directly</text><text x="720" y="311" font-size="12" fill="#1a1d1f" font-weight="600" text-anchor="end" data-claude-text-id="l0-tag">outside*</text><rect x="24" y="340" width="712" height="48" rx="6" fill="#fdf3e1" stroke="#e8a020" stroke-width="2"></rect><text x="40" y="361" font-size="13.5" fill="#1a1d1f" font-weight="600" data-claude-text-id="l1-name">Static system description (Microkit)</text><text x="40" y="378" font-size="11.5" fill="#5c6569" data-claude-text-id="l1-sub">fixed at build time: domains, channels, memory, budgets</text><text x="720" y="369" font-size="12" fill="#1a1d1f" font-weight="600" text-anchor="end" data-claude-text-id="l1-tag">tested</text><rect x="24" y="398" width="712" height="48" rx="6" fill="#fdf3e1" stroke="#e8a020" stroke-width="2"></rect><text x="40" y="419" font-size="13.5" fill="#1a1d1f" font-weight="600" data-claude-text-id="l2-name">seL4 microkernel with MCS</text><text x="40" y="436" font-size="11.5" fill="#5c6569" data-claude-text-id="l2-sub">only code at kernel privilege; time as a capability</text><text x="720" y="427" font-size="12" fill="#1a1d1f" font-weight="600" text-anchor="end" data-claude-text-id="l2-tag">proven†</text><rect x="24" y="456" width="712" height="48" rx="6" fill="#fdf3e1" stroke="#e8a020" stroke-width="2"></rect><text x="40" y="477" font-size="13.5" fill="#1a1d1f" font-weight="600" data-claude-text-id="l3-name">Bootloader</text><text x="40" y="494" font-size="11.5" fill="#5c6569" data-claude-text-id="l3-sub">measures and loads one signed image</text><text x="720" y="485" font-size="12" fill="#1a1d1f" font-weight="600" text-anchor="end" data-claude-text-id="l3-tag">assumed</text><rect x="24" y="514" width="712" height="48" rx="6" fill="#fdf3e1" stroke="#e8a020" stroke-width="2"></rect><text x="40" y="535" font-size="13.5" fill="#1a1d1f" font-weight="600" data-claude-text-id="l4-name">Firmware (OpenSBI / TF-A) · hardware · root of trust</text><text x="40" y="552" font-size="11.5" fill="#5c6569" data-claude-text-id="l4-sub">more privileged than the kernel; named and profiled</text><text x="720" y="543" font-size="12" fill="#1a1d1f" font-weight="600" text-anchor="end" data-claude-text-id="l4-tag">assumed</text><text x="24" y="586" font-size="11.5" fill="#5c6569" data-claude-text-id="fn1">* A driver is outside the trusted base only where the IOMMU confines its device.</text><text x="24" y="604" font-size="11.5" fill="#5c6569" data-claude-text-id="fn2">† Functional correctness for the verified configurations, which leave out kernel boot and IOMMU support.</text></svg>