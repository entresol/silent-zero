<svg viewBox="0 0 760 620" xmlns="http://www.w3.org/2000/svg" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="Path from 2026 to 2031, one station per year, each with its evidence: demonstration, test or proof."><text x="24" y="30" font-size="15" fill="#1a1d1f" font-weight="600" data-claude-text-id="title">Five years back from 2031: each station names its evidence</text><text x="24" y="50" font-size="11.5" fill="#5c6569" data-claude-text-id="subtitle">Demonstration: works once. Test: holds under defined load or attack. Proof: holds for every case the specification covers.</text><path d="M100 76V600" stroke="#9aa3a8" stroke-width="1.25" fill="none"></path><rect x="120" y="72" width="616" height="74" rx="6" fill="none" stroke="#9aa3a8" stroke-width="1.25"></rect><circle cx="100" cy="109.0" r="4" fill="#9aa3a8"></circle><text x="56" y="114.0" font-size="15" fill="#1a1d1f" font-weight="600" text-anchor="middle" data-claude-text-id="y2031-year">2031</text><text x="136" y="96" font-size="13.5" fill="#1a1d1f" font-weight="600" data-claude-text-id="y2031-name">One robot, one task, on zOS from boot to actuator</text><text x="136" y="115" font-size="11.5" fill="#5c6569" data-claude-text-id="y2031-body">Forty years after Linux; device, task and operating conditions defined.</text><rect x="136" y="123" width="46" height="16" rx="3" fill="none" stroke="#e8a020" stroke-width="1"></rect><text x="159" y="135" font-size="10.5" fill="#1a1d1f" font-weight="700" text-anchor="middle" data-claude-text-id="y2031-kind">TEST</text><text x="190" y="135" font-size="11.5" fill="#1a1d1f" data-claude-text-id="y2031-test">No compromised agent moves the actuator outside its safe envelope, under stated assumptions.</text><rect x="120" y="158" width="616" height="74" rx="6" fill="none" stroke="#9aa3a8" stroke-width="1.25"></rect><circle cx="100" cy="195.0" r="4" fill="#9aa3a8"></circle><text x="56" y="200.0" font-size="15" fill="#1a1d1f" font-weight="600" text-anchor="middle" data-claude-text-id="y2030-year">2030</text><text x="136" y="182" font-size="13.5" fill="#1a1d1f" font-weight="600" data-claude-text-id="y2030-name">Linux shrinks to a driver island</text><text x="136" y="201" font-size="11.5" fill="#5c6569" data-claude-text-id="y2030-body">Only accelerators still need legacy drivers.</text><rect x="136" y="209" width="46" height="16" rx="3" fill="none" stroke="#e8a020" stroke-width="1"></rect><text x="159" y="221" font-size="10.5" fill="#1a1d1f" font-weight="700" text-anchor="middle" data-claude-text-id="y2030-kind">TEST</text><text x="190" y="221" font-size="11.5" fill="#1a1d1f" data-claude-text-id="y2030-test">No Linux code on any control or authority path, checked against the system description.</text><rect x="120" y="244" width="616" height="74" rx="6" fill="none" stroke="#9aa3a8" stroke-width="1.25"></rect><circle cx="100" cy="281.0" r="4" fill="#9aa3a8"></circle><text x="56" y="286.0" font-size="15" fill="#1a1d1f" font-weight="600" text-anchor="middle" data-claude-text-id="y2029-year">2029</text><text x="136" y="268" font-size="13.5" fill="#1a1d1f" font-weight="600" data-claude-text-id="y2029-name">Broker and safety controller proven</text><text x="136" y="287" font-size="11.5" fill="#5c6569" data-claude-text-id="y2029-body">The two parts with the last word join the kernel as proven.</text><rect x="136" y="295" width="46" height="16" rx="3" fill="none" stroke="#e8a020" stroke-width="1"></rect><text x="159" y="307" font-size="10.5" fill="#1a1d1f" font-weight="700" text-anchor="middle" data-claude-text-id="y2029-kind">PROOF</text><text x="190" y="307" font-size="11.5" fill="#1a1d1f" data-claude-text-id="y2029-test">The proofs check. Plus a test: an external red team fails to escalate authority.</text><rect x="120" y="330" width="616" height="74" rx="6" fill="none" stroke="#9aa3a8" stroke-width="1.25"></rect><circle cx="100" cy="367.0" r="4" fill="#9aa3a8"></circle><text x="56" y="372.0" font-size="15" fill="#1a1d1f" font-weight="600" text-anchor="middle" data-claude-text-id="y2028-year">2028</text><text x="136" y="354" font-size="13.5" fill="#1a1d1f" font-weight="600" data-claude-text-id="y2028-name">First robot, Simplex style</text><text x="136" y="373" font-size="11.5" fill="#5c6569" data-claude-text-id="y2028-body">The agent proposes, the loop disposes. Multikernel proof due (announced).</text><rect x="136" y="381" width="46" height="16" rx="3" fill="none" stroke="#e8a020" stroke-width="1"></rect><text x="159" y="393" font-size="10.5" fill="#1a1d1f" font-weight="700" text-anchor="middle" data-claude-text-id="y2028-kind">TEST</text><text x="190" y="393" font-size="11.5" fill="#1a1d1f" data-claude-text-id="y2028-test">Control deadlines hold under defined load while the agent is hijacked.</text><rect x="120" y="416" width="616" height="74" rx="6" fill="none" stroke="#9aa3a8" stroke-width="1.25"></rect><circle cx="100" cy="453.0" r="4" fill="#9aa3a8"></circle><text x="56" y="458.0" font-size="15" fill="#1a1d1f" font-weight="600" text-anchor="middle" data-claude-text-id="y2027-year">2027</text><text x="136" y="440" font-size="13.5" fill="#1a1d1f" font-weight="600" data-claude-text-id="y2027-name">zOS 0.01: one board, one kernel, one agent, one loop</text><text x="136" y="459" font-size="11.5" fill="#5c6569" data-claude-text-id="y2027-body">On an open RISC-V core. MCS proof for AArch64 due (announced).</text><rect x="136" y="467" width="46" height="16" rx="3" fill="none" stroke="#e8a020" stroke-width="1"></rect><text x="159" y="479" font-size="10.5" fill="#1a1d1f" font-weight="700" text-anchor="middle" data-claude-text-id="y2027-kind">DEMO</text><text x="190" y="479" font-size="11.5" fill="#1a1d1f" data-claude-text-id="y2027-test">Boots from a measured image; a stranger builds it from source.</text><rect x="120" y="502" width="616" height="74" rx="6" fill="#fdf3e1" stroke="#e8a020" stroke-width="2"></rect><circle cx="100" cy="539.0" r="4" fill="#e8a020"></circle><text x="56" y="544.0" font-size="15" fill="#1a1d1f" font-weight="600" text-anchor="middle" data-claude-text-id="y2026-year">2026</text><text x="136" y="526" font-size="13.5" fill="#1a1d1f" font-weight="600" data-claude-text-id="y2026-name">The base exists as open source (documented)</text><text x="136" y="545" font-size="11.5" fill="#5c6569" data-claude-text-id="y2026-body">seL4 MCS · Microkit · LionsOS · Verus · OpenTitan · CHERI · ROS 2 on seL4 · MCP</text><text x="136" y="565" font-size="11.5" fill="#1a1d1f" data-claude-text-id="y2026-test">Missing: the broker, the tool adapters, the safety path, and evidence that the parts fit.</text></svg>